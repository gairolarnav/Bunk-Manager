<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Bunk Manager</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" sizes="32x32" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" id="app" data-state="neutral">
    <header class="header">
      <h1 class="title">Bunk Manager</h1>
      <p class="subtitle">Track your attendance. Bunk responsibly.</p>
    </header>

    <div class="segmented" role="group" aria-label="Input mode">
      <span class="segmented__thumb" aria-hidden="true"></span>
      <button type="button" class="segmented__btn is-active" aria-pressed="true" data-mode="attended">
        Classes Attended
      </button>
      <button type="button" class="segmented__btn" aria-pressed="false" data-mode="missed">
        Classes Missed
      </button>
    </div>

    <form class="inputs" id="calcForm" novalidate>
      <label class="field">
        <span class="field__label">Total Classes</span>
        <input
          class="field__input"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          id="totalInput"
          placeholder="Total Classes"
          autocomplete="off"/>
      </label>

      <label class="field">
        <span class="field__label" id="countLabel">Classes Attended</span>
        <input
          class="field__input"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          id="countInput"
          placeholder="Number of classes attended"
          autocomplete="off"/>
      </label>

      <p class="error" id="errorMsg" role="alert" hidden></p>

      <button type="submit" class="submit">Calculate</button>
    </form>

    <div class="hero">
      <div class="hero__value" id="percentText">---</div>
      <div class="progress"
        id="progressBar"
        role="progressbar"
        aria-label="Attendance"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0">
        <div class="progress__fill" id="progressFill"></div>
        <span class="progress__marker" aria-hidden="true"></span>
      </div>
      <p class="hero__caption" id="heroCaption">Enter your numbers to begin</p>
    </div>
    <div class="card" aria-live="polite">
      <span class="card__badge" id="cardBadge">Safe Area</span>
      <p class="card__text" id="cardText">Your attendance summary will appear here.</p>
      <p class="card__ggw" id="ggwText" hidden>GGW</p>
    </div>
    <div class="meme" id="memeArea" hidden>
      <img class="meme__image" id="memeImage" src="./image/dawg.webp" alt="" />
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
